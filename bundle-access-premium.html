<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Successful — 100+ DFY AI Prompts</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-secondary);
        }

        .success-card {
            background: white;
            padding: 60px 40px;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: heroFadeIn 0.8s var(--ease-out-expo) forwards;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #E8F5E9;
            color: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 32px;
        }

        .success-card h1 {
            margin-bottom: 12px;
            font-size: 32px;
            color: var(--text-primary);
            font-weight: 800;
        }

        .success-card p {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 18px;
            line-height: 1.6;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-access {
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            color: white;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .btn-whatsapp {
            background: #00A884;
            color: white;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .btn-home {
            background: white;
            color: var(--text-primary);
            padding: 16px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            border: 1px solid #E2E8F0;
            margin-top: 8px;
        }

        .btn-access:hover,
        .btn-whatsapp:hover {
            transform: translateY(-2px);
        }

        .btn-home:hover {
            background: #F8FAFC;
        }
    </style>
</head>

<body>
    <div class="thank-you-wrap">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h1>Thank You!</h1>
            <p>You have successfully upgraded your plan. 🥳</p>

            <div class="btn-stack">
                <a href="https://drive.google.com/drive/folders/1UbwIK10f4b-LAIR3DpG5z_cH7UJIRIni?usp=sharing"
                    class="btn-access btn-download" target="_blank">
                    <span>🔗</span> Access Your Purchase <span class="download-arrow">↓</span>
                </a>
                <a href="https://wa.me/917427802454" class="btn-whatsapp" target="_blank">
                    <span>💬</span> WhatsApp Support
                </a>
                <a href="index.html" class="btn-home">
                    <span>←</span> Back to Home
                </a>
            </div>
        </div>
    </div>
</body>

</html>
